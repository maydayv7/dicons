name: Release packages

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian-13
            image: debian:trixie-slim
          - name: fedora-44
            image: fedora:44
          - name: arch
            image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build and test
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          git archive --format=tar.gz --prefix=dicons/ -o "$RUNNER_TEMP/source.tar.gz" HEAD
          docker run --rm -v "$RUNNER_TEMP/source.tar.gz:/source.tar.gz:ro" \
            -v "$PWD/packaging:/packaging:ro" -v "$RUNNER_TEMP/packages:/out" \
            "$IMAGE" bash /packaging/build-release.sh "$GITHUB_REF_NAME"
      - name: Install in a fresh container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/packaging:/checks:ro" -v "$RUNNER_TEMP/packages:/out:ro" \
            "$IMAGE" bash /checks/check-install.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error
          compression-level: 0

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build x86-64 AppImage
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/runtime" \
            https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          docker run --rm -v "$PWD:/src:ro" -v "$RUNNER_TEMP/runtime:/runtime:ro" \
            -v "$RUNNER_TEMP/appimage:/out" debian:trixie-slim bash -ec '
              apt-get update
              apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config \
                libgtk-4-dev libglib2.0-dev libgtk4-layer-shell-dev dconf-gsettings-backend \
                adwaita-icon-theme librsvg2-common squashfs-tools
              bash /src/packaging/appimage/build.sh "$1" /runtime /out
            ' build "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v6
        with:
          name: appimage
          path: ${{ runner.temp }}/appimage/*.AppImage
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [package, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: packages
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes
